<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>Ani's Ride</title>
  <meta name="description" content="Bus commute helper for Anika — Vinyaas Virtue to College and back">
  <meta name="theme-color" content="#8B9E8B">

  <!-- PWA & iOS -->
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Ani's Ride">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <!-- Google Fonts — Playfair Display + Plus Jakarta Sans + DM Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #F7F3ED;
      --card: #FFFEFB;
      --accent: #8B9E8B;
      --accent-hover: #748C74;
      --accent-light: rgba(139, 158, 139, 0.09);
      --accent-medium: rgba(139, 158, 139, 0.30);
      --text-primary: #3A3631;
      --text-secondary: #8A8279;
      --text-muted: #B5AFA8;
      --border: #EDE8E1;
      --card-shadow: 0 1px 6px rgba(58, 54, 49, 0.04);
      --card-shadow-hover: 0 4px 14px rgba(58, 54, 49, 0.07);
      --pill-shadow: 0 4px 14px rgba(139, 158, 139, 0.20);
      --radius-card: 18px;
      --radius-pill: 50px;
      --radius-sm: 12px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --warm-orange: #C4A282;
      --warm-orange-light: rgba(196, 162, 130, 0.10);
      --warm-orange-dark: #A07A5A;
      --direct-color: #8B9E8B;
      --transfer-color: #B29D82;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--text-primary);
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .app {
      width: 100%;
      max-width: 430px;
      min-height: 100dvh;
      position: relative;
      padding: 0 22px;
      padding-bottom: calc(190px + var(--safe-bottom));
    }

    /* ── Header ── */
    .header { padding: 56px 0 4px 0; animation: fadeSlideDown 0.6s ease; }
    .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
    .app-name { font-family: 'Playfair Display', Georgia, serif; font-size: 14px; font-weight: 500; font-style: italic; letter-spacing: 0.5px; text-transform: lowercase; color: var(--accent); }
    .header-date { font-size: 11px; font-weight: 600; color: var(--text-muted); letter-spacing: 0.3px; }
    .greeting { font-family: 'Playfair Display', Georgia, serif; font-size: 28px; font-weight: 600; color: var(--text-primary); margin-top: 10px; line-height: 1.2; letter-spacing: -0.3px; }
    .greeting-sub { font-size: 13px; color: var(--text-secondary); margin-top: 6px; font-weight: 500; }

    /* ── Tab Toggle ── */
    .tab-container { margin: 22px 0 18px 0; animation: fadeSlideDown 0.6s ease 0.1s both; }
    .tab-toggle { display: flex; background: var(--card); border-radius: var(--radius-pill); padding: 5px; box-shadow: var(--card-shadow); border: 1px solid var(--border); }
    .tab-btn {
      flex: 1; padding: 13px 16px; border: none; background: transparent;
      font-family: 'Plus Jakarta Sans', sans-serif; font-size: 13px; font-weight: 600; color: var(--text-secondary);
      cursor: pointer; border-radius: var(--radius-pill);
      transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex; align-items: center; justify-content: center; gap: 8px;
      user-select: none; letter-spacing: 0.3px;
    }
    .tab-btn.active { color: #FFFFFF; background: var(--accent); box-shadow: var(--pill-shadow); }
    .tab-btn:not(.active):hover { color: var(--text-primary); background: var(--accent-light); }

    /* ── Route Summary Card ── */
    .route-summary {
      background: var(--card); border-radius: var(--radius-card); padding: 20px 22px;
      margin-bottom: 18px; box-shadow: var(--card-shadow); border: 1px solid var(--border);
      animation: fadeSlideDown 0.5s ease 0.15s both;
    }
    .route-summary-title { font-family: 'Playfair Display', Georgia, serif; font-size: 14px; font-weight: 600; font-style: italic; color: var(--text-primary); margin-bottom: 14px; display: flex; align-items: center; gap: 6px; }
    .route-journey { display: flex; align-items: center; gap: 0; margin-bottom: 16px; }
    .route-point { font-size: 11px; font-weight: 700; color: var(--text-primary); max-width: 90px; font-family: 'Plus Jakarta Sans', sans-serif; }
    .route-point.start { text-align: left; margin-right: 8px; }
    .route-point.end { text-align: right; margin-left: 8px; }
    .route-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .route-dot.start-dot { background: var(--accent); }
    .route-dot.end-dot { background: var(--warm-orange); }
    .route-line { flex: 1; height: 1.5px; background: linear-gradient(to right, var(--accent), var(--warm-orange)); position: relative; border-radius: 4px; }
    .route-line-label { position: absolute; top: -19px; left: 50%; transform: translateX(-50%); font-size: 10px; color: var(--text-muted); white-space: nowrap; font-weight: 500; font-family: 'DM Mono', monospace; }
    .route-chips { display: flex; gap: 8px; flex-wrap: wrap; }
    .route-chip {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 6px 12px; border-radius: var(--radius-pill);
      font-size: 11px; font-weight: 500; background: var(--bg); color: var(--text-secondary);
      border: 1px solid var(--border);
    }

    /* ── Section Divider ── */
    .section-divider {
      font-family: 'DM Mono', monospace; font-size: 10px; font-weight: 500; letter-spacing: 1.5px; text-transform: uppercase;
      color: var(--text-muted); margin-bottom: 14px; padding-left: 4px;
      display: flex; align-items: center; gap: 10px;
    }
    .section-divider-line { flex: 1; height: 1px; background: var(--border); }

    /* ── Bus Card ── */
    .bus-list { display: flex; flex-direction: column; gap: 14px; transition: opacity 0.3s ease, transform 0.3s ease; }
    .bus-list.fade-out { opacity: 0; transform: translateY(8px); }
    .bus-list.fade-in { opacity: 1; transform: translateY(0); }

    .bus-card {
      background: var(--card); border-radius: var(--radius-card); padding: 18px 20px;
      box-shadow: var(--card-shadow); border: 1px solid var(--border);
      display: flex; align-items: flex-start; gap: 16px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); opacity: 0; transform: translateY(12px);
      animation: cardFadeIn 0.4s ease forwards;
    }
    .bus-card:hover { box-shadow: var(--card-shadow-hover); transform: translateY(-2px); }
    .bus-card.past { opacity: 0.45; filter: grayscale(0.3); }
    .bus-card.past:hover { transform: none; box-shadow: var(--card-shadow); }
    .bus-card.next-bus { border: 1.5px solid var(--accent); box-shadow: 0 2px 16px rgba(139, 158, 139, 0.12); }

    .bus-left { display: flex; flex-direction: column; align-items: center; gap: 8px; flex-shrink: 0; }
    .bus-number-pill {
      width: 58px; height: 54px; border-radius: 14px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-family: 'DM Mono', 'Courier New', monospace; font-size: 13px; font-weight: 500; color: var(--accent); background: var(--accent-light);
      letter-spacing: 0.5px; line-height: 1.1; text-align: center;
      border: 1px solid rgba(139, 158, 139, 0.08);
    }
    .bus-number-pill .bus-type-label { font-family: 'DM Mono', monospace; font-size: 8px; font-weight: 400; letter-spacing: 0.5px; opacity: 0.65; margin-top: 2px; }
    .bus-card.next-bus .bus-number-pill { background: var(--accent); color: #FFFFFF; border-color: transparent; }
    .bus-card.transfer .bus-number-pill { color: var(--transfer-color); background: rgba(178, 157, 130, 0.08); border-color: rgba(178, 157, 130, 0.08); }

    .maps-link {
      font-size: 10px; font-weight: 600; color: var(--accent); text-decoration: none;
      display: flex; align-items: center; gap: 3px; opacity: 0.65; transition: opacity 0.2s;
      font-family: 'DM Mono', monospace; letter-spacing: 0.3px;
    }
    .maps-link:hover { opacity: 1; }

    .bus-info { flex: 1; min-width: 0; }
    .bus-top-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; gap: 6px; flex-wrap: wrap; }
    .bus-badge-group { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; justify-content: flex-end; }
    .next-label {
      font-family: 'DM Mono', monospace; font-size: 9px; font-weight: 500; letter-spacing: 1.2px; text-transform: uppercase;
      color: #FFFFFF; background: var(--accent); padding: 3px 9px; border-radius: var(--radius-pill);
    }
    .bus-departure { font-family: 'Playfair Display', Georgia, serif; font-size: 22px; font-weight: 600; color: var(--text-primary); letter-spacing: -0.3px; }
    .bus-card.past .bus-departure { color: var(--text-muted); }

    .bus-stop-row { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
    .bus-stop-name { font-size: 12.5px; font-weight: 500; color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; }
    .bus-stop-icon { font-size: 11px; flex-shrink: 0; color: var(--text-muted); font-family: 'DM Mono', monospace; }

    .bus-transfer-detail {
      font-size: 11px; color: var(--text-secondary); margin-bottom: 8px; padding: 7px 12px;
      background: rgba(178, 157, 130, 0.05); border-radius: var(--radius-sm); line-height: 1.5; font-weight: 500;
      border: 1px solid rgba(178, 157, 130, 0.08);
    }
    .bus-transfer-detail strong { color: var(--text-primary); font-weight: 700; }

    .bus-meta-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .countdown-badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 4px 11px; border-radius: var(--radius-pill);
      font-size: 11px; font-weight: 500; background: var(--accent-light); color: var(--accent-hover);
      white-space: nowrap; font-family: 'DM Mono', monospace;
    }
    .countdown-badge.urgent { background: var(--warm-orange-light); color: var(--warm-orange-dark); animation: subtlePulse 2s ease-in-out infinite; }
    .countdown-badge.past-badge { background: rgba(0,0,0,0.03); color: var(--text-muted); }
    .meta-badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 4px 11px; border-radius: var(--radius-pill);
      font-size: 11px; font-weight: 500; background: var(--bg); color: var(--text-secondary);
      white-space: nowrap;
    }
    .bus-note { font-size: 11px; color: var(--text-muted); margin-top: 6px; font-style: italic; font-weight: 400; font-family: 'Playfair Display', Georgia, serif; }

    .gate-tag {
      font-family: 'DM Mono', monospace; font-size: 9px; font-weight: 500; letter-spacing: 0.5px; text-transform: lowercase;
      color: var(--warm-orange-dark); background: rgba(196, 162, 130, 0.12);
      padding: 3px 9px; border-radius: var(--radius-pill);
    }
    .direct-tag {
      font-family: 'DM Mono', monospace; font-size: 9px; font-weight: 500; letter-spacing: 0.5px; text-transform: lowercase;
      color: #5B7A5B; background: rgba(139, 158, 139, 0.10);
      padding: 3px 9px; border-radius: var(--radius-pill);
    }
    .transfer-tag {
      font-family: 'DM Mono', monospace; font-size: 9px; font-weight: 500; letter-spacing: 0.5px; text-transform: lowercase;
      color: var(--transfer-color); background: rgba(178, 157, 130, 0.10);
      padding: 3px 9px; border-radius: var(--radius-pill);
    }

    /* ── Past Buses ── */
    .past-section { margin-top: 20px; }
    .past-toggle {
      display: flex; align-items: center; gap: 8px; padding: 13px 18px;
      background: transparent; border: 1.5px dashed var(--border); border-radius: var(--radius-card);
      font-family: 'Plus Jakarta Sans', sans-serif; font-size: 13px; font-weight: 600; color: var(--text-muted);
      cursor: pointer; width: 100%; transition: all 0.2s ease;
    }
    .past-toggle:hover { border-color: var(--text-muted); color: var(--text-secondary); }
    .past-toggle-icon { transition: transform 0.3s ease; font-size: 12px; }
    .past-toggle-icon.open { transform: rotate(90deg); }
    .past-buses-list { display: none; flex-direction: column; gap: 10px; margin-top: 12px; }
    .past-buses-list.show { display: flex; }

    /* ── Route Guide ── */
    .route-guide {
      margin-top: 26px; padding: 20px 20px; background: var(--card);
      border-radius: var(--radius-card); box-shadow: var(--card-shadow); border: 1px solid var(--border);
      animation: fadeSlideDown 0.5s ease 0.4s both;
    }
    .guide-title { font-family: 'Playfair Display', Georgia, serif; font-size: 14px; font-weight: 600; font-style: italic; color: var(--text-secondary); margin-bottom: 16px; }
    .guide-item { display: flex; align-items: flex-start; gap: 14px; padding: 14px 0; }
    .guide-item:not(:last-child) { border-bottom: 1px solid var(--border); }
    .guide-pill {
      width: 72px; padding: 10px 6px; border-radius: var(--radius-sm);
      font-family: 'DM Mono', monospace; font-size: 11px; font-weight: 500; text-align: center; flex-shrink: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
      line-height: 1.25;
    }
    .guide-pill.direct { color: var(--direct-color); background: rgba(139, 158, 139, 0.08); border: 1px solid rgba(139, 158, 139, 0.08); }
    .guide-pill.transfer { color: var(--transfer-color); background: rgba(178, 157, 130, 0.08); border: 1px solid rgba(178, 157, 130, 0.08); }
    .guide-info { flex: 1; min-width: 0; }
    .guide-route-name { font-family: 'Playfair Display', Georgia, serif; font-size: 13px; font-weight: 600; color: var(--text-primary); margin-bottom: 4px; }
    .guide-route-desc { font-size: 12px; color: var(--text-secondary); line-height: 1.55; font-weight: 500; }
    .guide-tag { display: inline-block; font-family: 'DM Mono', monospace; font-size: 9px; font-weight: 400; letter-spacing: 0.3px; text-transform: lowercase; padding: 4px 9px; border-radius: var(--radius-pill); margin-top: 8px; }
    .guide-tag.d { color: #5B7A5B; background: rgba(139, 158, 139, 0.08); }
    .guide-tag.t { color: var(--transfer-color); background: rgba(178, 157, 130, 0.08); }

    /* ── Illustrations ── */
    .header-illustration { width: 100%; max-height: 120px; object-fit: cover; border-radius: var(--radius-card); margin-bottom: 18px; opacity: 0.85; animation: fadeSlideDown 0.6s ease 0.2s both; }
    .no-buses-illustration { width: 160px; height: 160px; object-fit: contain; margin: 0 auto 16px; opacity: 0.8; }
    .guide-floral { width: 100%; max-height: 40px; object-fit: contain; opacity: 0.5; margin-bottom: 14px; }

    /* ── No Buses ── */
    .no-buses { text-align: center; padding: 40px 24px; animation: fadeSlideDown 0.5s ease; }
    .no-buses-title { font-family: 'Playfair Display', Georgia, serif; font-size: 18px; font-weight: 600; font-style: italic; color: var(--text-primary); margin-bottom: 8px; }
    .no-buses-text { font-size: 13px; color: var(--text-secondary); line-height: 1.6; font-weight: 500; }
    .no-buses-tip { margin-top: 16px; padding: 12px 16px; background: var(--accent-light); border-radius: var(--radius-sm); font-size: 12px; color: var(--accent-hover); font-weight: 600; }

    /* ── WhatsApp Button ── */
    .wa-wrap { position: fixed; bottom: calc(24px + var(--safe-bottom)); left: 50%; transform: translateX(-50%); z-index: 100; animation: fadeSlideUp 0.6s ease 0.5s both; }
    .wa-btn {
      display: flex; align-items: center; gap: 8px; padding: 16px 38px;
      background: var(--accent); color: #FFFFFF; border: none; border-radius: var(--radius-pill);
      font-family: 'Playfair Display', Georgia, serif; font-size: 15px; font-weight: 500; font-style: italic; cursor: pointer;
      box-shadow: var(--pill-shadow), 0 4px 20px rgba(139, 158, 139, 0.15);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); user-select: none; white-space: nowrap;
      letter-spacing: 0.3px;
    }
    .wa-btn:hover { background: var(--accent-hover); transform: translateY(-2px); }
    .wa-btn:active { transform: scale(0.95); box-shadow: 0 2px 12px rgba(139, 158, 139, 0.2); }

    /* ── Install Banner ── */
    .install-banner { display: none; margin-top: 20px; padding: 18px 20px; background: var(--card); border-radius: var(--radius-card); box-shadow: var(--card-shadow); border: 1px solid var(--border); }
    .install-banner.show { display: block; }
    .install-banner-title { font-family: 'Playfair Display', Georgia, serif; font-size: 14px; font-weight: 600; font-style: italic; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
    .install-banner-text { font-size: 13px; color: var(--text-secondary); line-height: 1.5; font-weight: 500; }
    .install-dismiss { margin-top: 12px; padding: 8px 18px; background: var(--accent-light); border: none; border-radius: var(--radius-pill); font-family: 'Plus Jakarta Sans', sans-serif; font-size: 12px; font-weight: 700; color: var(--accent); cursor: pointer; }

    /* ── Animations ── */
    @keyframes fadeSlideDown { from { opacity: 0; transform: translateY(-12px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeSlideUp { from { opacity: 0; transform: translate(-50%, 16px); } to { opacity: 1; transform: translate(-50%, 0); } }
    @keyframes cardFadeIn { to { opacity: 1; transform: translateY(0); } }
    @keyframes subtlePulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
    .bus-card:nth-child(1) { animation-delay: 0.05s; }
    .bus-card:nth-child(2) { animation-delay: 0.1s; }
    .bus-card:nth-child(3) { animation-delay: 0.15s; }
    .bus-card:nth-child(4) { animation-delay: 0.2s; }
    .bus-card:nth-child(5) { animation-delay: 0.25s; }
    .bus-card:nth-child(6) { animation-delay: 0.3s; }
    .bus-card:nth-child(7) { animation-delay: 0.35s; }
    .bus-card:nth-child(8) { animation-delay: 0.4s; }
    .bus-card:nth-child(9) { animation-delay: 0.45s; }
    .bus-card:nth-child(10) { animation-delay: 0.5s; }
    ::-webkit-scrollbar { width: 0; }
    @media (max-width: 360px) {
      .greeting { font-size: 24px; }
      .bus-card { padding: 15px 15px; gap: 12px; }
      .bus-number-pill { width: 50px; height: 48px; font-size: 12px; }
      .wa-btn { padding: 14px 30px; font-size: 14px; }
      .bus-departure { font-size: 20px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-top">
        <span class="app-name">ani's ride</span>
        <span class="header-date" id="headerDate"></span>
      </div>
      <h1 class="greeting" id="greeting"></h1>
      <p class="greeting-sub" id="greetingSub"></p>
    </header>

    <img src="images/header.png" alt="" class="header-illustration">

    <nav class="tab-container">
      <div class="tab-toggle">
        <button class="tab-btn active" id="tabCollege" onclick="switchTab('college')">
          🎓 to college
        </button>
        <button class="tab-btn" id="tabHome" onclick="switchTab('home')">
          🏡 to home
        </button>
      </div>
    </nav>

    <div class="route-summary" id="routeSummary"></div>

    <section class="schedule-section">
      <div class="bus-list" id="busList"></div>
      <div class="past-section" id="pastSection" style="display:none;">
        <button class="past-toggle" id="pastToggle" onclick="togglePast()">
          <span class="past-toggle-icon" id="pastIcon">&#9656;</span>
          <span id="pastText">past buses</span>
        </button>
        <div class="past-buses-list" id="pastList"></div>
      </div>
    </section>

    <div class="route-guide" id="routeGuide"></div>

    <div class="install-banner" id="installBanner">
      <div class="install-banner-title">add to home screen</div>
      <p class="install-banner-text">
        Tap <strong>Share</strong> &rarr; <strong>"Add to Home Screen"</strong> in Safari to use this like a real app.
      </p>
      <button class="install-dismiss" onclick="dismissInstall()">got it</button>
    </div>
  </div>

  <div class="wa-wrap">
    <button class="wa-btn" onclick="sendReached()">reached 🤍</button>
  </div>

  <script>
    // ═══════════════════════════════════════════════════════
    //  BUS SCHEDULE DATA
    // ═══════════════════════════════════════════════════════

    const MAPS_LINKS = {
      walkToHMTHospital: "https://www.google.com/maps/dir/?api=1&origin=Vinyaas+Virtue,+Bahubali+Nagar,+Jalahalli,+Bengaluru&destination=HMT+Hospital+Bus+Stop,+Jalahalli+Road,+Bengaluru&travelmode=walking",
      walkToJalahalliVillage: "https://www.google.com/maps/dir/?api=1&origin=Vinyaas+Virtue,+Bahubali+Nagar,+Jalahalli,+Bengaluru&destination=Jalahalli+Village+Bus+Stop,+Bengaluru&travelmode=walking",

    // ═══════════════════════════════════════════════════════
    //  UTILS
    // ═══════════════════════════════════════════════════════
    function parseTime(t) {
      const [time, p] = t.split(' ');
      let [h, m] = time.split(':').map(Number);
      if (p === 'PM' && h !== 12) h += 12;
      if (p === 'AM' && h === 12) h = 0;
      const now = new Date();
      return new Date(now.getFullYear(), now.getMonth(), now.getDate(), h, m, 0);
    }
    function minsUntil(t) { return Math.round((parseTime(t) - new Date()) / 60000); }
    function fmtCountdown(m) {
      if (m <= 0) return { text: "departed", past: true, urgent: false };
      if (m <= 5) return { text: `${m} min \u2014 hurry!`, past: false, urgent: true };
      if (m < 60) return { text: `in ${m} min`, past: false, urgent: false };
      const h = Math.floor(m / 60), r = m % 60;
      return { text: r ? `in ${h}h ${r}m` : `in ${h}h`, past: false, urgent: false };
    }
    function shiftTime(t, delta) {
      const d = parseTime(t);
      d.setMinutes(d.getMinutes() + delta);
      return d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
    }
    function fmtDate() {
      const d = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
      const mo = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      const n = new Date();
      return `${d[n.getDay()]}, ${n.getDate()} ${mo[n.getMonth()]}`;
    }
    function mapsUrl(from, to) {
      return `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(from + ', Bengaluru')}&destination=${encodeURIComponent(to + ', Bengaluru')}&travelmode=transit`;
    }

      if (h >= 5 && h < 12) { g.textContent = `good morning, ${name} ☀️`; s.textContent = "here are your buses today"; }
      else if (h >= 12 && h < 17) { g.textContent = `good afternoon, ${name} 🌤`; s.textContent = "ready to head home?"; }
      else if (h >= 17 && h < 21) { g.textContent = `good evening, ${name} 🌙`; s.textContent = "catch your ride back"; }
      else { g.textContent = `hey ${name} ✨`; s.textContent = "planning tomorrow's commute?"; }
      document.getElementById('headerDate').textContent = fmtDate();
    }

      sched.forEach(b => { const m = minsUntil(b.time); (m <= -2 ? pa : up).push({ ...b, mins: m }); });

      const fullLink = currentTab === 'college' ? MAPS_LINKS.transitFullCollege : MAPS_LINKS.transitFullHome;

        if (directBuses.length > 0) {

        if (transferBuses.length > 0) {

            const isNext = !firstDone;

      if (cd.past) badge += ' past-badge';

      const leaveBy = shiftTime(bus.time, -bus.walkMin);
      const arriveBy = shiftTime(bus.time, bus.ride);
      const c = currentTab === 'college';
      const from = bus.stop;
      const to = bus.alight;

      const pillContent = bus.type === 'transfer'
        ? `${bus.connector}<div class="bus-type-label">\u2192 ${bus.secondBus}</div>`
        : bus.bus;

      return `<div class="${cls.join(' ')}">
        <div class="bus-left">
          <div class="bus-number-pill">
            ${pillContent}
          </div>
          ${!isPast ? `<a href="${mapsUrl(from, to)}" target="_blank" class="maps-link">📍 map</a>` : ''}

                   <strong>2.</strong> Board <strong>273-B</strong> or <strong>276</strong> toward Jalahalli<br>
                   <strong>3.</strong> Get off at <strong>HMT Hospital Stop</strong> \u00b7 ~22\u201325 min ride<br>
                   <strong>4.</strong> Walk home \u00b7 ~5 min`}
            </div>
            <span class="guide-tag d">direct from HMT Hospital Stop \u00b7 ~25 min total</span>
          </div>
        </div>

        <div class="guide-item">
          <div class="guide-pill direct">
            <span>273</span>
          </div>
          <div class="guide-info">
            <div class="guide-route-name">Jalahalli Village Direct Route</div>
            <div class="guide-route-desc">
              ${c
                ? `<strong>1.</strong> Walk to <strong>Jalahalli Village Stop</strong> \u00b7 ~300m / 3 min<br>
                   <strong>2.</strong> Board <strong>273</strong><br>
                   <strong>3.</strong> Get off at <strong>MS Ramaiah College Stop</strong> \u00b7 ~16 min ride<br>
                   <strong>4.</strong> Walk to campus \u00b7 ~5 min`
                : `<strong>1.</strong> Walk to <strong>MS Ramaiah College Stop</strong> \u00b7 ~5 min from campus<br>
                   <strong>2.</strong> Board <strong>273</strong> toward Jalahalli<br>
                   <strong>3.</strong> Get off at <strong>Jalahalli Village Stop</strong> \u00b7 ~16 min<br>
                   <strong>4.</strong> Walk home \u00b7 ~3 min`}
            </div>
            <span class="guide-tag d">shortest walk from home \u00b7 3 min</span>
          </div>
        </div>

        <div class="guide-item">
          <div class="guide-pill transfer">
            <span>502 / 501</span>
            <span style="font-size:8.5px;opacity:0.65;">transfer</span>
          </div>
          <div class="guide-info">
            <div class="guide-route-name">Transfer Route via BEL Circle</div>
            <div class="guide-route-desc">
              ${c
                ? `<strong>1.</strong> Walk to <strong>Jalahalli Village Stop</strong> \u00b7 ~3 min<br>
                   <strong>2.</strong> Board <strong>502-C</strong>, <strong>502-E</strong>, or <strong>501-NH</strong> \u2192 <strong>BEL Circle</strong> \u00b7 4 min<br>
                   <strong>3.</strong> Switch to <strong>273-C</strong> or <strong>401-K</strong> \u2192 <strong>MS Ramaiah College Stop</strong> \u00b7 7-12 min<br>
                   <strong>4.</strong> Walk to campus \u00b7 ~5 min`
                : `<strong>1.</strong> Walk to <strong>MS Ramaiah College Stop</strong> \u00b7 ~5 min<br>
                   <strong>2.</strong> Board <strong>273-C</strong> or <strong>401-K</strong> \u2192 <strong>BEL Circle</strong> \u00b7 7-12 min<br>
                   <strong>3.</strong> Switch to <strong>502-C</strong>, <strong>502-E</strong>, or <strong>501-NH</strong> \u2192 <strong>Jalahalli Village Stop</strong> \u00b7 4 min<br>
                   <strong>4.</strong> Walk home \u00b7 ~3 min`}
            </div>
            <span class="guide-tag t">2 buses \u00b7 ~25 min total</span>
          </div>
        </div>

        <div class="guide-item">
          <div class="guide-pill transfer">
            <span>maps</span>
          </div>
          <div class="guide-info">
            <div class="guide-route-name">Walking & Live Transit</div>
            <div class="guide-route-desc" style="display:flex;flex-direction:column;gap:6px;">
              <a href="${MAPS_LINKS.walkToHMTHospital}" target="_blank" style="color:var(--accent);font-weight:600;text-decoration:none;">walk to HMT Hospital Stop \u00b7 5 min \u2192</a>
              <a href="${MAPS_LINKS.walkToJalahalliVillage}" target="_blank" style="color:var(--accent);font-weight:600;text-decoration:none;">walk to Jalahalli Village Stop \u00b7 3 min \u2192</a>
              <a href="${c ? MAPS_LINKS.walkFromStopToCollege : MAPS_LINKS.walkFromCollegeToStop}" target="_blank" style="color:var(--warm-orange-dark);font-weight:600;text-decoration:none;">${c ? 'bus stop \u2192 campus' : 'campus \u2192 bus stop'} \u00b7 5 min \u2192</a>
              <a href="${c ? MAPS_LINKS.transitFullCollege : MAPS_LINKS.transitFullHome}" target="_blank" style="color:var(--transfer-color);font-weight:600;text-decoration:none;">open live google maps route \u2192</a>
            </div>
          </div>
        </div>
      `;
    }

    // ═══════════════════════════════════════════════════════
    //  PAST, WHATSAPP, PWA, INIT
    // ═══════════════════════════════════════════════════════
    function togglePast() {
      pastOpen = !pastOpen;
      document.getElementById('pastIcon').classList.toggle('open', pastOpen);
      document.getElementById('pastList').classList.toggle('show', pastOpen);
    }
    function sendReached() { window.open(`https://wa.me/${WA_PHONE}?text=${encodeURIComponent(WA_MSG)}`, '_blank'); }
    function checkInstall() {
      const ios = /iphone|ipad|ipod/.test(navigator.userAgent.toLowerCase());
      const sa = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
      if (ios && !sa && !localStorage.getItem('installDismissed')) document.getElementById('installBanner').classList.add('show');
    }
    function dismissInstall() { document.getElementById('installBanner').classList.remove('show'); localStorage.setItem('installDismissed', 'true'); }

    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});

    function init() {
      updateGreeting();
      renderSummary();
      renderSchedule();
      renderGuide();
      checkInstall();
      if (new Date().getHours() >= 13) switchTab('home');
      setInterval(() => { renderSchedule(); updateGreeting(); }, 30000);
    }
    init();
  </script>
</body>
</html>
